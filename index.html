<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Art Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header & Navigation -->
    <header>
        <div class="logo">Artist Name</div>
        <nav>
            <ul class="nav-links">
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Visual Artist & Illustrator</h1>
        <p>Welcome to my creative space.</p>
    </section>

    <!-- Gallery Section -->
    <section id="gallery" class="gallery-grid">
        <div class="gallery-item">
            <img src="images/artwork1.jpg" alt="Sample Artwork 1">
        </div>
        <div class="gallery-item">
            <img src="images/artwork2.jpg" alt="Sample Artwork 2">
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact">
        <h2>Get in Touch</h2>
        <p>Email: artist@example.com</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
